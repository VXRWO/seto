{% extends 'rental/base.html' %}

{% block title %}Вход — СЭТО{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-dark text-white text-center py-3">
        <h5 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Вход в систему</h5>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="invalid-feedback d-block">{{ field.errors|join:", " }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-dark w-100 mt-2">Войти</button>
        </form>
      </div>
      <div class="card-footer text-center bg-white">
        <small class="text-muted">
          Нет аккаунта?
          <a href="{% url 'register' %}">Зарегистрироваться</a>
        </small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
